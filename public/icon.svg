<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="20" fill="#0a2e36"/>
  <!-- Left Ear -->
  <path d="M 30 40 L 12 18 L 45 25 Z" fill="#00bcd4" stroke="#00bcd4" stroke-width="2" stroke-linejoin="round" />
  <!-- Right Ear -->
  <path d="M 70 40 L 88 18 L 55 25 Z" fill="#00bcd4" stroke="#00bcd4" stroke-width="2" stroke-linejoin="round" />
  <!-- Head -->
  <circle cx="50" cy="55" r="35" fill="#00bcd4" />
  <!-- Snout -->
  <ellipse cx="50" cy="65" rx="16" ry="11" fill="#0a2e36" />
  <!-- Nostrils -->
  <circle cx="44" cy="65" r="2.5" fill="#00bcd4" />
  <circle cx="56" cy="65" r="2.5" fill="#00bcd4" />
  <!-- Eyes -->
  <circle cx="34" cy="45" r="4.5" fill="#0a2e36" />
  <circle cx="66" cy="45" r="4.5" fill="#0a2e36" />
  <!-- Eye sparkles for cuteness -->
  <circle cx="32" cy="43" r="1.5" fill="#00bcd4" />
  <circle cx="64" cy="43" r="1.5" fill="#00bcd4" />
  <!-- Blush -->
  <ellipse cx="23" cy="55" rx="4" ry="2" fill="#0a2e36" opacity="0.3" />
  <ellipse cx="77" cy="55" rx="4" ry="2" fill="#0a2e36" opacity="0.3" />
</svg>
